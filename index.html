<style>

label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}

.links{display:flex;gap:12px;font-size:13px}

.iw .ph{height:100px;margin-bottom:6px}

<script>
/* ===== 설정 ===== */
const CONFIG = {
  NAVER_KEY: "i63k5hdv08",              // NCP 콘솔의 Maps 앱 Client ID를 여기에 입력 (비우면 간이 지도로 동작)

/* ===== 상황 목록 ===== */
const SITUATIONS = [
  ["all","전체"],
  ["cafe_study","카공","공부하기 좋은 카페"],["cafe_mood","분좋카","분위기 좋은 카페"],["dessert","디저트"],
  ["date","데이트"],["solo","혼밥"],["team","회식"],
  ["pick","오순도순 맛zip","오순도순 팀원들이 직접 추천하는 맛집"]
];
/* ===== 업종 (먹고 싶은 메뉴) ===== */
const TYPES = ["한식","양식","중식","일식","카페&디저트","고기&구이&회","아시아음식"];
const TYPE_RULES = [   /* food_type.py와 같은 규칙. shops.json에 type이 없을 때만 씀 */
  ["카페&디저트", /카페|디저트|베이커리|커피|제과|빙수|케이크|도넛|와플/],
  ["고기&구이&회", /고기|구이|삼겹|소고기|갈비|곱창|막창|생선회|횟집|회포차|육회|대패|족발|보쌈/],
  ["아시아음식", /베트남|태국|인도|아시아|동남아|쌀국수|팟타이|커리|카레/],
  ["중식", /중식|중국|마라|짬뽕|짜장|훠궈|양꼬치/],
  ["일식", /일식|일본|돈가스|돈까스|라멘|초밥|스시|이자카야|오뎅|꼬치|우동|소바|규동|로바다/],
  ["양식", /양식|이탈리아|피자|파스타|햄버거|버거|샌드위치|멕시코|스테이크|브런치|와인|BAR/],
  ["한식", /한식|국밥|감자탕|순대|치킨|닭|포장마차|포차|주점|맥주|호프|쌈밥|냉면|찌개|백반|솥밥|칼국수|샤브|분식|떡볶이|술집/]
];
function typeOf(s){
  if(TYPES.includes(s.type)) return s.type;
  const t = (s.category||"") + " " + s.name;
  const r = TYPE_RULES.find(([,rx]) => rx.test(t));
  return r ? r[0] : "";
}

/* ===== 시연용 샘플 데이터 (가상 가게). 실제로는 shops.json으로 교체 ===== */
const SAMPLE = [
  {name:"[예시] 고잔 이자카야 하루",category:"이자카야",address:"고잔동 일대",lat:37.3168,lng:126.8348,situations:["friends","date"],tags:["분위기 좋음","안주 맛집","심야"],price:2,maxGroup:8,summary:"조명이 낮고 아늑해서 오래 앉아 이야기하기 좋은 곳.",menu:"모둠 사시미, 하이볼"},
  {name:"[예시] 호수공원 레스토랑 모네",category:"양식",address:"고잔동 일대",lat:37.3141,lng:126.8302,situations:["date","parents"],tags:["기념일","조용함","예약 추천"],price:3,maxGroup:6,summary:"창가 좌석에서 야경이 보이는 코스 요리 전문점.",menu:"스테이크, 파스타 코스"},
  {name:"[예시] 중앙동 삼겹살 두툼",category:"고깃집",address:"고잔동 일대",lat:37.3187,lng:126.8391,situations:["team","friends"],tags:["단체석","시끌벅적","가성비"],price:2,maxGroup:20,summary:"단체 회식에 자주 쓰이는 넓은 홀과 룸이 있는 고깃집.",menu:"생삼겹살, 된장찌개"},
  {name:"[예시] 혼밥 국밥 한그릇",category:"한식",address:"고잔동 일대",lat:37.3159,lng:126.8366,situations:["solo","study"],tags:["빠른 식사","1인석","가성비"],price:1,maxGroup:3,summary:"바 좌석이 있어 혼자 와도 편한 돼지국밥집.",menu:"돼지국밥, 수육"},
  {name:"[예시] 한식당 정담",category:"한정식",address:"고잔동 일대",lat:37.3112,lng:126.8321,situations:["parents","team"],tags:["룸","조용함","주차 가능"],price:3,maxGroup:12,summary:"룸이 분리되어 있어 어른들과 식사하기 편한 한정식.",menu:"정식 코스, 보쌈"},
  {name:"[예시] 에리카 앞 치킨 투게더",category:"치킨/호프",address:"ERICA 앞",lat:37.2975,lng:126.8352,situations:["friends","study"],tags:["학생 많음","늦게까지","시끌벅적"],price:1,maxGroup:16,summary:"팀플 끝나고 모이기 좋은 대학가 호프집.",menu:"양념치킨, 골뱅이무침"},
  {name:"[예시] 에리카 앞 마라탕 홍",category:"중식",address:"ERICA 앞",lat:37.2958,lng:126.8379,situations:["solo","study"],tags:["혼밥 가능","점심 인기","가성비"],price:1,maxGroup:6,summary:"혼자도 여럿이도 부담 없는 마라탕 전문점.",menu:"마라탕, 꿔바로우"},
  {name:"[예시] 에리카 파스타 바질",category:"양식",address:"ERICA 앞",lat:37.2969,lng:126.8398,situations:["date","study"],tags:["감성","아늑함","사진 찍기 좋음"],price:2,maxGroup:6,summary:"학교 앞에서 데이트하기 좋은 아기자기한 파스타집.",menu:"크림파스타, 리조또"},
  {name:"[예시] 에리카 포차 별밤",category:"포차",address:"ERICA 앞",lat:37.2946,lng:126.8361,situations:["friends","team"],tags:["심야","단체 가능","안주 다양"],price:2,maxGroup:20,summary:"새벽까지 영업해서 2차로 가기 좋은 포장마차 스타일 술집.",menu:"우동탕, 닭발"},
  {name:"[예시] 고잔 와인바 오후",category:"와인바",address:"고잔동 일대",lat:37.3205,lng:126.8332,situations:["date","friends"],tags:["분위기 좋음","조용함","기념일"],price:3,maxGroup:4,summary:"둘이 조용히 이야기하기 좋은 작은 와인바.",menu:"와인 페어링 플레이트"}
];

/* ===== 상태 ===== */
let onlyOpen = false, unknownHidden = 0;
let currentType = "all";
let SHOPS = [], current = "all", selected = null, map = null, naverOn = false, leafletOn = false;
const markers = [];
const $ = s => document.querySelector(s);

/* ===== 추천 로직: 조건 필터 + 상황 일치 순 정렬 ===== */
function filterShops(skipOpen){
  const size = +$("#size").value, budget = +$("#budget").value;
  return SHOPS.filter(s =>
    s.maxGroup >= size && s.price <= budget &&
    (current === "all" || s.situations.includes(current)) &&
    (currentType === "all" || typeOf(s) === currentType) &&
    (skipOpen || !onlyOpen || openStatus(s).state === "open"));
}
function recommend(){
  const list = filterShops(false);
  const pickFirst = (a,b) => b.situations.includes("pick") - a.situations.includes("pick");
  if(current === "all") return list.sort((a,b) => pickFirst(a,b) || a.name.localeCompare(b.name, "ko"));
  return list.sort((a,b) => (b.situations.length === 1) - (a.situations.length === 1) || a.price - b.price);
}

/* ===== 영업 여부 (한국 시간 기준) =====
   shops.json 필드: hours "11:00-22:00" / hoursByDay {"fri":"17:00-03:00"} / closedDays ["mon"] / breakTime "15:00-17:00" */
const DAYS = ["sun","mon","tue","wed","thu","fri","sat"];
const DAYKO = {sun:"일",mon:"월",tue:"화",wed:"수",thu:"목",fri:"금",sat:"토"};
function seoulNow(){
  const p = new Intl.DateTimeFormat("en-US", {timeZone:"Asia/Seoul", weekday:"short", hour:"numeric", minute:"numeric", hourCycle:"h23"}).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { day: g("weekday").slice(0,3).toLowerCase(), min: (+g("hour") % 24) * 60 + +g("minute") };
}
function parseRange(str){
  if(!str) return null;
  if(/^(24h|24시간)/.test(str)) return [0,1440];
  const m = String(str).match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  const a = +m[1]*60 + +m[2]; let b = +m[3]*60 + +m[4];
  if(b <= a) b += 1440;
  return [a, b];
}
function hoursFor(s, day){
  if((s.closedDays||[]).includes(day)) return null;
  return (s.hoursByDay && s.hoursByDay[day]) || s.hours || null;
}
function openStatus(s){
  if(!s.hours && !s.hoursByDay) return {state:"unknown"};
  const now = seoulNow();
  const today = parseRange(hoursFor(s, now.day));
  if(today && now.min >= today[0] && now.min < today[1]){
    const br = parseRange(s.breakTime);
    if(br && now.min >= br[0] && now.min < br[1]) return {state:"break"};
    return {state:"open"};
  }
  const prev = DAYS[(DAYS.indexOf(now.day) + 6) % 7];
  const y = parseRange(hoursFor(s, prev));
  if(y && y[1] > 1440 && now.min < y[1] - 1440) return {state:"open"};
  return {state:"closed"};
}
function statusChip(s){
  const st = openStatus(s).state;
  const label = {open:"영업중", closed:"영업 종료", break:"브레이크타임"}[st];
  return label ? `<span class="st ${st}">${label}</span>` : "";
}
function hoursLine(s){
  const parts = [];
  if(s.hours) parts.push("영업 " + s.hours);
  if(s.breakTime) parts.push("브레이크 " + s.breakTime);
  if(s.closedDays && s.closedDays.length) parts.push("휴무 " + s.closedDays.map(d => DAYKO[d] || d).join("·"));
  return parts.join(" · ");
}

/* ===== 가게 상세 정보 (카드·말풍선 공통) ===== */
const SITLABEL = Object.fromEntries(SITUATIONS.filter(x => x[0] !== "all").map(([k,l]) => [k,l]));
const WEEKORDER = ["mon","tue","wed","thu","fri","sat","sun"];
function esc(v){ return String(v ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function showRange(r){ return r === "24h" || r === "24시간" ? "24시간" : r.replace("-", " – "); }
function hasHours(s){ return !!(s.hours || s.hoursByDay); }
function todayLine(s){
  if(!hasHours(s)) return "";
  const d = seoulNow().day, r = hoursFor(s, d);
  return `<div class="today"><b>오늘(${DAYKO[d]})</b> ${r ? showRange(r) : "휴무"}${r && s.breakTime ? ` <span class="dim">브레이크 ${showRange(s.breakTime)}</span>` : ""}</div>`;
}
function weekTable(s){
  if(!hasHours(s)) return "";
  const today = seoulNow().day;
  return `<details class="week"><summary>요일별 영업시간</summary><table>${WEEKORDER.map(d => {
    const r = hoursFor(s, d);
    return `<tr class="${d === today ? "now" : ""}"><th>${DAYKO[d]}</th><td>${r ? showRange(r) : "휴무"}</td></tr>`;
  }).join("")}</table>${s.breakTime ? `<div class="dim">브레이크타임 ${showRange(s.breakTime)}</div>` : ""}</details>`;
}
function menuBlock(s, n){
  const items = (s.menuItems || []).filter(m => m.name);
  if(items.length) return `<ul class="menu">${items.slice(0, n).map(m =>
    `<li><span>${esc(m.name)}</span><i></i><b>${m.price ? Number(m.price).toLocaleString("ko-KR") + "원" : "시가"}</b></li>`).join("")}</ul>`;
  return s.menu ? `<div class="meta">추천 메뉴 · ${esc(s.menu)}</div>` : "";
}
function pickBlock(s){
  if(!s.situations.includes("pick")) return "";
  return `<div class="pickbox"><b>오순도순 추천${s.pickBy ? ` · ${esc(s.pickBy)}` : ""}</b>${s.pickNote ? `<div>${esc(s.pickNote)}</div>` : ""}</div>`;
}
function sitBlock(s){
  return s.situations.length ? `<div class="sits">${s.situations.filter(k => k !== "pick").map(k => `<span class="sit">${SITLABEL[k] || k}</span>`).join("")}</div>` : "";
}
function linkBlock(s){
  const q = encodeURIComponent(s.name.replace("[예시] ",""));
  return `<div class="links">
      <a href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">네이버에서 최신 정보</a>
      <a href="https://map.naver.com/p/directions/-/${s.lng},${s.lat},${encodeURIComponent(s.name)}/-/walk" target="_blank" rel="noopener">길찾기</a>
    </div>`;
}
function metaLine(s){
  return [typeOf(s) || s.category.split(">").pop(), s.area || s.address, s.price ? won(s.price) : "", s.maxGroup ? `최대 ${s.maxGroup}명` : ""].filter(Boolean).map(esc).join(" · ");
}

/* ===== 렌더링 ===== */
function renderChips(){
  $("#chips").innerHTML = SITUATIONS.map(([k,l,tip]) =>
    `<button class="chip${k==="pick"?" pick":""}" data-k="${k}" title="${tip||l}" aria-pressed="${k===current}">${l}</button>`).join("");
  $("#kinds").innerHTML = [["all","전체"], ...TYPES.map(t => [t,t])].map(([k,l]) =>
    `<button class="chip" data-t="${k}" aria-pressed="${k===currentType}">${l}</button>`).join("");
  $("#kinds").onclick = e => {
    const b = e.target.closest(".chip"); if(!b) return;
    currentType = b.dataset.t; selected = null; renderChips(); update();
  };
  $("#chips").onclick = e => {
    const b = e.target.closest(".chip"); if(!b) return;
    current = b.dataset.k; selected = null; renderChips(); update();
  };
}
function won(p){ return ["","1만원 안팎","2만원 안팎","3만원 이상"][p]; }
function renderList(items){
  if(!items.length){
    $("#list").innerHTML = `<div class="empty">${onlyOpen?"지금 영업 중인 가게가 없거나, 영업시간 정보가 아직 입력되지 않았어요.":"조건에 맞는 가게가 없어요.<br>상황이나 메뉴, 인원·예산을 바꿔 보세요."}</div>`; return;
  }
  $("#list").innerHTML = `<div class="count">총 ${items.length}곳${onlyOpen?` · 영업중만 (영업시간 정보 없는 ${unknownHidden}곳은 제외)`:""}</div>` + items.map((s,i) => `
    <article class="card ${s===selected?"on":""}" data-i="${i}" tabindex="0">
      ${s.photo?`<img class="ph" src="${esc(s.photo)}" alt="${esc(s.name)}" loading="lazy" onerror="this.remove()">`:""}
      <h3><span>${esc(s.name)}${statusChip(s)}</span>${s.draft?`<span class="fit">태그 초안</span>`:""}</h3>
      <div class="meta">${metaLine(s)}</div>
      ${todayLine(s)}
      ${pickBlock(s)}
      ${sitBlock(s)}
      ${s.summary?`<p>${esc(s.summary)}</p>`:""}
      ${menuBlock(s, 3)}
      ${linkBlock(s)}
    </article>`).join("");
  $("#list").onclick = $("#list").onkeydown = e => {
    if(e.type==="keydown" && e.key!=="Enter") return;
    if(e.target.closest("a")) return;
    const c = e.target.closest(".card"); if(!c) return;
    select(items[+c.dataset.i], items);
  };
}
function infoHTML(s){
  return `<div class="iw">
    ${s.photo?`<img class="ph" src="${esc(s.photo)}" alt="${esc(s.name)}" loading="lazy" onerror="this.remove()">`:""}
    <div class="iw-name">${esc(s.name)}${statusChip(s)}</div>
    <div class="iw-meta">${metaLine(s)}</div>
    ${todayLine(s)}
    ${weekTable(s)}
    ${hasHours(s) ? "" : `<div class="iw-meta">영업시간 정보가 아직 없어요</div>`}
    ${pickBlock(s)}
    ${sitBlock(s)}
    ${s.summary?`<div class="iw-sum">${esc(s.summary)}</div>`:""}
    ${menuBlock(s, 6)}
    ${s.tags.length?`<div class="tags">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
    ${s.draft?`<div class="iw-meta">추천 상황은 업종으로 추정한 초안이에요</div>`:""}
    ${linkBlock(s)}
  </div>`;
}
let infoWin = null;
function openInfo(s, m){
  if(!infoWin) infoWin = new naver.maps.InfoWindow({ maxWidth:320, borderColor:"#ddd4bf", borderWidth:1, anchorSize:new naver.maps.Size(12,12), pixelOffset:new naver.maps.Point(0,-4) });
  infoWin.setContent(infoHTML(s));
  infoWin.open(map, m);
}
function select(s, items){
  selected = s; renderList(items); drawMarkers(items);
  const c = $("#list .card.on"); if(c) c.scrollIntoView({block:"nearest", behavior:"smooth"});
  if(naverOn) map.panTo(new naver.maps.LatLng(s.lat, s.lng));
  if(leafletOn) map.panTo([s.lat, s.lng]);
}

/* ===== 지도: 네이버 지도 (키 없으면 간이 지도) ===== */
function drawMarkers(items){
  if(infoWin) infoWin.close();
  markers.forEach(m => m.remove());
  markers.length = 0;
  items.forEach(s => {
    if(leafletOn){
      const m = L.marker([s.lat, s.lng], {
        icon: L.divIcon({className:"", html:`<div class="lp ${s===selected?"on":""} ${s.situations.includes("pick")?"pk":""}"></div>`, iconSize:[22,22], iconAnchor:[11,11]}),
        title: s.name
      }).addTo(map);
      m.bindTooltip(s.name);
      m.bindPopup(infoHTML(s), {maxWidth:320, minWidth:260});
      m.on("click", () => select(s, items));
      markers.push(m);
      if(s===selected) m.openPopup();
    } else if(naverOn){
      const m = new naver.maps.Marker({
        position:new naver.maps.LatLng(s.lat,s.lng), map, title:s.name,
        icon:{ content:`<div class="lp ${s===selected?"on":""} ${s.situations.includes("pick")?"pk":""}"></div>`, anchor:new naver.maps.Point(s===selected?14:10, s===selected?14:10) },
        zIndex: s===selected ? 100 : 1
      });
      naver.maps.Event.addListener(m,"click",()=>select(s,items));
      m.remove = () => m.setMap(null);
      markers.push(m);
      if(s===selected) openInfo(s, m);
    } else {
      const el = document.createElement("button");
      el.className = "pin" + (s===selected?" on":""); el.title = s.name; el.setAttribute("aria-label", s.name);
      const b = bounds();
      el.style.left = ((s.lng-b.w)/(b.e-b.w)*100)+"%";
      el.style.top = ((b.n-s.lat)/(b.n-b.s)*100)+"%";
      el.onclick = () => select(s, items);
      $("#map").appendChild(el);
      el.remove = () => el.parentNode && el.parentNode.removeChild(el);
      markers.push(el);
    }
  });
  if(leafletOn && items.length && !selected){
    map.fitBounds(items.map(s => [s.lat, s.lng]), {padding:[40,40], maxZoom:16});
  }
}
function bounds(){ return {n:37.3235,s:37.2875,w:126.8260,e:126.8470}; }

function initFakeMap(msg){
  const m = $("#map"); m.className = "fake";
  m.innerHTML = `<span class="zone" style="left:38%;top:10%">고잔동 일대</span>
    <span class="zone" style="left:50%;top:78%">한양대 ERICA 앞</span>
    <div class="note">${msg}</div>`;
}
let naverFailed = false, tilesOk = false;
function naverFail(reason){
  if(naverFailed) return; naverFailed = true;
  console.error("[네이버 지도 실패]", reason);
  naverOn = false; markers.length = 0; map = null;
  $("#mapwrap").innerHTML = '<div id="map"></div>';
  const b = document.createElement("div");
  b.className = "banner";
  b.innerHTML = "<b>네이버 지도를 불러오지 못해 임시로 OpenStreetMap을 보여드려요.</b><br>원인: " + reason +
    "<br>확인 ① Client ID가 <u>Maps Application</u>의 것인지 (NAVER API HUB 검색용 키는 안 됩니다) " +
    "② NCP의 Web 서비스 URL에 <u>" + location.protocol + "//" + location.hostname + "</u> 가 등록돼 있는지 (포트 번호는 빼고 등록)";
  $("#mapwrap").appendChild(b);
  loadLeaflet();
}
function initNaver(){
  try{
    if(!(window.naver && naver.maps)) throw new Error("naver.maps 객체가 없습니다");
    map = new naver.maps.Map("map", { center:new naver.maps.LatLng(CONFIG.CENTER.lat,CONFIG.CENTER.lng), zoom:14 });
    naver.maps.Event.addListener(map, "tilesloaded", () => { tilesOk = true; });
    naverOn = true; update();
    setTimeout(() => { const h = $("#map").offsetHeight; if(h < 50) naverFail("지도 영역의 높이가 " + h + "px로 너무 작음"); }, 1500);
  }catch(e){ naverFail("지도 생성 오류: " + e.message); }
}
function loadMap(){
  if(!CONFIG.NAVER_KEY) return loadLeaflet();
  window.navermap_authFailure = () => naverFail("네이버 인증 실패(키 또는 등록 URL 불일치)");
  const sc = document.createElement("script");
  sc.src = "https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=" + encodeURIComponent(CONFIG.NAVER_KEY.trim());
  sc.onload = initNaver;
  sc.onerror = () => naverFail("네이버 지도 스크립트를 불러올 수 없음(인터넷/차단 확인)");
  document.head.appendChild(sc);
  setTimeout(() => { if(!tilesOk && !naverFailed) naverFail("지도 화면(타일)이 로드되지 않음. 대부분 등록한 Web 서비스 URL 문제"); }, 6000);
}

/* 키 없이 쓰는 실제 지도 (OpenStreetMap + Leaflet) */
function loadLeaflet(){
  const css = document.createElement("link");
  css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
  document.head.appendChild(css);
  const sc = document.createElement("script");
  sc.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  sc.onload = () => {
    map = L.map("map").setView([CONFIG.CENTER.lat, CONFIG.CENTER.lng], 14);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
    leafletOn = true; update();
  };
  sc.onerror = () => { initFakeMap("지도를 불러오지 못했어요. 인터넷 연결을 확인하세요. (간이 지도로 표시 중)"); update(); };
  document.head.appendChild(sc);
}

function update(){
  const items = recommend();
  unknownHidden = onlyOpen ? filterShops(true).filter(s => openStatus(s).state === "unknown").length : 0;
  renderList(items); drawMarkers(items);
}

/* ===== 시작 ===== */
const VALID_SIT = new Set(SITUATIONS.map(x => x[0]).filter(k => k !== "all"));
async function start(){
  try{
    const r = await fetch(CONFIG.DATA_URL);
    if(!r.ok) throw 0;
    SHOPS = await r.json();
  }catch(e){ SHOPS = SAMPLE; }
  if(!SHOPS.length) SHOPS = SAMPLE;
  SHOPS = SHOPS.filter(s => typeof s.lat === "number" && typeof s.lng === "number").map(s => ({
    ...s, situations:(s.situations||[]).filter(x => VALID_SIT.has(x)), tags:s.tags||[], category:s.category||"",
    summary:s.summary||"", menu:s.menu||"", photo:s.photo||"", menuItems:Array.isArray(s.menuItems)?s.menuItems:[], price:s.price||2, maxGroup:s.maxGroup||30
  }));
  renderChips();
  $("#openBtn").onclick = () => { onlyOpen = !onlyOpen; $("#openBtn").setAttribute("aria-pressed", onlyOpen); selected = null; update(); };
  ["#size","#budget"].forEach(id => $(id).onchange = () => { selected=null; update(); });
  loadMap();
}
start();
</script>
</body>
